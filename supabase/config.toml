# Supabase project configuration for local development and deploys (`supabase start`, `supabase db push`, `supabase functions deploy`).
# Written without access to the Supabase CLI; validate with `supabase start` and adjust keys if the CLI version reports differences.
project_id = "nomi"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
# Native deep link used after Google sign-in and email confirmation (see apps/mobile/app.json "scheme").
site_url = "nomi://auth/callback"
additional_redirect_urls = ["nomi://auth/callback", "http://localhost:8081", "exp://localhost:8081/--/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true            # new accounts must verify their email address
secure_password_change = true
max_frequency = "60s"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.interpret]
verify_jwt = true                      # only signed-in users can reach the interpreter
